name: Workflow DevOps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integracion-y-pruebas:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código del repositorio
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # 2. Configura el entorno de ejecución
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Integración: instala dependencias
    - name: Instalar dependencias (CI)
      run: npm install

    # 4. Pruebas: ejecuta los tests automáticos
    - name: Ejecutar pruebas unitarias (Test)
      run: npm test

  simulacion-despliegue:
    needs: integracion-y-pruebas
    runs-on: ubuntu-latest

    steps:
    # 5. Despliegue simulado (CD)
    - name: Simulación de Despliegue a Producción
      run: |
        echo "FASE DE DESPLIEGUE CONTINUO (CD)"
        echo "Pruebas superadas con éxito."
        echo "Desplegando artefacto a Google Cloud / Servidor..."
        echo "Despliegue finalizado exitosamente."